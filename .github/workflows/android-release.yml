name: Build Yokan Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - '2.*'
      - '[0-9]+.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Nombre del tag o versión de release (ej. 2.1)'
        required: false
        default: '2.1'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: 'true'

      - name: Configure build properties and RAM
        run: |
          sed -i 's/org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx8g -XX:+UseG1GC -Dfile.encoding=UTF-8/' gradle.properties
          sed -i 's/kotlin.daemon.jvmargs=.*/kotlin.daemon.jvmargs=-Xmx4g -XX:+UseG1GC/' gradle.properties
          sed -i 's/org.gradle.workers.max=.*/org.gradle.workers.max=4/' gradle.properties
          
          echo "jvm.toolchain.version=21" >> local.properties
          echo "kotlin.native.ignoreDisabledTargets=true" >> local.properties
          echo "ani.android.abis=arm64-v8a" >> local.properties
          echo "ani.enable.firebase=false" >> local.properties

      - name: Generate Signing Keystore
        id: keystore
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          keytool -genkeypair \
            -alias yokan \
            -keypass yokan123 \
            -keystore "$KEYSTORE_PATH" \
            -storepass yokan123 \
            -dname "CN=Yokan, OU=Yokan, O=Yokan, L=Local, S=State, C=US" \
            -validity 10000 \
            -keyalg RSA \
            -keysize 2048
          echo "keystore_path=$KEYSTORE_PATH" >> "$GITHUB_OUTPUT"

      - name: Build Android Release APK (arm64-v8a)
        run: |
          chmod +x ./gradlew
          ./gradlew :app:android:assembleDefaultRelease \
            -Pani.android.abis=arm64-v8a \
            -Psigning_release_storeFile="${{ steps.keystore.outputs.keystore_path }}" \
            -Psigning_release_storePassword="yokan123" \
            -Psigning_release_keyAlias="yokan" \
            -Psigning_release_keyPassword="yokan123" \
            "-Dorg.gradle.jvmargs=-Xmx8g -XX:+UseG1GC -Dfile.encoding=UTF-8" \
            "-Dkotlin.daemon.jvm.options=-Xmx4g" \
            --stacktrace

      - name: Organize APKs
        id: apks
        run: |
          mkdir -p output_apks
          APK_ARM64=$(find app/android/build/outputs/apk -name "*arm64-v8a*.apk" | head -n 1)
          if [ -n "$APK_ARM64" ] && [ -f "$APK_ARM64" ]; then
            cp "$APK_ARM64" output_apks/yokan-arm64-v8a.apk
          fi
          
          APK_UNIVERSAL=$(find app/android/build/outputs/apk -name "*universal*.apk" | head -n 1)
          if [ -n "$APK_UNIVERSAL" ] && [ -f "$APK_UNIVERSAL" ]; then
            cp "$APK_UNIVERSAL" output_apks/yokan-universal.apk
          fi
          
          if [ -z "$(ls -A output_apks)" ]; then
            find app/android/build/outputs/apk -name "*.apk" -exec cp {} output_apks/ \;
          fi
          
          echo "Generated APKs:"
          ls -lh output_apks/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yokan-apks
          path: output_apks/*.apk
          if-no-files-found: error

      - name: Determine Tag Name
        id: tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "val=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.tag_name }}" ]; then
            echo "val=${{ inputs.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "val=2.1" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.val }}
          name: Yokan ${{ steps.tag.outputs.val }}
          body: |
            ## Yokan ${{ steps.tag.outputs.val }}

            Aplicación moderna de anime con arquitectura híbrida de reproducción: motor BitTorrent P2P + Web Streaming (AnimeAV1 con HLS nativo sin anuncios).

            ### Archivos disponibles:
            - **`yokan-arm64-v8a.apk`**: APK optimizado para dispositivos Android modernos de 64 bits (arm64-v8a).
            - **`yokan-universal.apk`**: APK compatible con todas las arquitecturas Android.

            ### Novedades en la versión 2.1 (Integración Híbrida AnimeAV1 y Torrent):
            - ⚡ **Integración Híbrida Web Streaming (AnimeAV1)**: Reproducción directa por streaming web sin esperas de semillas para animes antiguos, de nicho o conexiones móviles ligeras.
            - 🛡️ **Servidor UPN por Defecto con Descifrado AES-128-CBC**: Extracción directa de playlists master HLS (`.m3u8`) del servidor UPN (`uns.bio`) sin anuncios ni ventanas emergentes.
            - 🚫 **Bloqueador de Anuncios y Popups**: Filtro de dominios publicitarios y bloqueo de overlays y ventanas flotantes para reproducción limpia.
            - 🔀 **Selector de Fuentes Híbrido en UI**: Pestañas en el modal de selección para alternar entre "Streaming Web (AnimeAV1)" y "Torrents P2P (Nyaa / Erai-raws)".
            - 🎯 **Auto-Resolver Inteligente**: Intento prioritario en servidor UPN de AnimeAV1 con fallback automático a la red BitTorrent.
          draft: false
          prerelease: false
          files: |
            output_apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
