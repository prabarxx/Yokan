name: Build Yokan Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Ensure Android platform 37
        run: |
          sdkmanager "platforms;android-37" "build-tools;37.0.0" || true

      - name: Configure build properties
        run: |
          sed -i 's/org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx6g -XX:+UseG1GC -Dfile.encoding=UTF-8/' gradle.properties
          sed -i 's/kotlin.daemon.jvmargs=.*/kotlin.daemon.jvmargs=-Xmx3g -XX:+UseG1GC/' gradle.properties
          sed -i 's/org.gradle.workers.max=.*/org.gradle.workers.max=4/' gradle.properties
          # local.properties es leído primero por build-logic/properties.kt
          {
            echo "ani.android.abis=all"
            echo "ani.enable.firebase=false"
            echo "kotlin.native.ignoreDisabledTargets=true"
          } >> local.properties

      - name: Restore release keystore from secrets (o generar efímero)
        id: keystore
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$KEYSTORE_PATH"
            echo "store_pass=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_OUTPUT"
            echo "key_alias=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_OUTPUT"
            echo "key_pass=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_OUTPUT"
          else
            keytool -genkeypair \
              -alias yokan \
              -keypass yokan123 \
              -keystore "$KEYSTORE_PATH" \
              -storepass yokan123 \
              -dname "CN=Yokan, OU=Yokan, O=Yokan, L=Local, S=State, C=US" \
              -validity 10000 \
              -keyalg RSA \
              -keysize 2048
            echo "store_pass=yokan123" >> "$GITHUB_OUTPUT"
            echo "key_alias=yokan" >> "$GITHUB_OUTPUT"
            echo "key_pass=yokan123" >> "$GITHUB_OUTPUT"
          fi
          echo "keystore_path=$KEYSTORE_PATH" >> "$GITHUB_OUTPUT"
          echo "::warning::Usando keystore efímero: cada build firma con clave distinta y Android exigirá desinstalar para actualizar. Para firma estable, añade los secrets ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD."

      - name: Build Android Release APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:android:assembleDefaultRelease \
            -Pani.android.abis=all \
            -Psigning_release_storeFile="${{ steps.keystore.outputs.keystore_path }}" \
            -Psigning_release_storePassword="${{ steps.keystore.outputs.store_pass }}" \
            -Psigning_release_keyAlias="${{ steps.keystore.outputs.key_alias }}" \
            -Psigning_release_keyPassword="${{ steps.keystore.outputs.key_pass }}" \
            --stacktrace

      - name: Organize APKs
        id: apks
        run: |
          mkdir -p output_apks
          # Con abis=all + universalApk=true se generan: arm64-v8a, armeabi-v7a, x86_64 y universal
          ARM64=$(find app/android/build/outputs/apk -name "*arm64-v8a*.apk" | head -n 1)
          UNIVERSAL=$(find app/android/build/outputs/apk -name "*universal*.apk" | head -n 1)
          if [ -n "$ARM64" ] && [ -f "$ARM64" ]; then
            cp "$ARM64" output_apks/yokan-arm64-v8a.apk
          fi
          if [ -n "$UNIVERSAL" ] && [ -f "$UNIVERSAL" ]; then
            cp "$UNIVERSAL" output_apks/yokan-universal.apk
          fi
          if [ -z "$(ls -A output_apks 2>/dev/null)" ]; then
            echo "::error::No se encontró ningún APK. Contenido de outputs:"
            find app/android/build/outputs/apk -type f || true
            exit 1
          fi
          echo "Generated APKs:"
          ls -lh output_apks/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yokan-apks
          path: output_apks/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release (solo en tags v*)
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
        uses: softprops/action-gh-release@v2
        with:
          name: Yokan ${{ github.ref_name }}
          body: |
            ## Yokan ${{ github.ref_name }}

            ### Archivos disponibles:
            - **`yokan-arm64-v8a.apk`**: APK optimizado para dispositivos Android modernos de 64 bits (arm64-v8a).
            - **`yokan-universal.apk`**: APK compatible con todas las arquitecturas Android.
          draft: false
          prerelease: false
          files: |
            output_apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
