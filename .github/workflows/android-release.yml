name: Build Yokan Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Nombre del tag o versión de release (ej. v1.0.6)'
        required: false
        default: 'v1.0.6'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: 'true'

      - name: Configure build properties and RAM
        run: |
          sed -i 's/org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx8g -XX:+UseG1GC -Dfile.encoding=UTF-8/' gradle.properties
          sed -i 's/kotlin.daemon.jvmargs=.*/kotlin.daemon.jvmargs=-Xmx4g -XX:+UseG1GC/' gradle.properties
          sed -i 's/org.gradle.workers.max=.*/org.gradle.workers.max=4/' gradle.properties
          
          echo "jvm.toolchain.version=21" >> local.properties
          echo "kotlin.native.ignoreDisabledTargets=true" >> local.properties
          echo "ani.android.abis=arm64-v8a" >> local.properties
          echo "ani.enable.firebase=false" >> local.properties

      - name: Generate Signing Keystore
        id: keystore
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          keytool -genkeypair \
            -alias yokan \
            -keypass yokan123 \
            -keystore "$KEYSTORE_PATH" \
            -storepass yokan123 \
            -dname "CN=Yokan, OU=Yokan, O=Yokan, L=Local, S=State, C=US" \
            -validity 10000 \
            -keyalg RSA \
            -keysize 2048
          echo "keystore_path=$KEYSTORE_PATH" >> "$GITHUB_OUTPUT"

      - name: Build Android Release APK (arm64-v8a)
        run: |
          chmod +x ./gradlew
          ./gradlew :app:android:assembleDefaultRelease \
            -Pani.android.abis=arm64-v8a \
            -Psigning_release_storeFile="${{ steps.keystore.outputs.keystore_path }}" \
            -Psigning_release_storePassword="yokan123" \
            -Psigning_release_keyAlias="yokan" \
            -Psigning_release_keyPassword="yokan123" \
            "-Dorg.gradle.jvmargs=-Xmx8g -XX:+UseG1GC -Dfile.encoding=UTF-8" \
            "-Dkotlin.daemon.jvm.options=-Xmx4g" \
            --stacktrace

      - name: Organize APKs
        id: apks
        run: |
          mkdir -p output_apks
          APK_ARM64=$(find app/android/build/outputs/apk/default/release -name "*arm64-v8a-release.apk" | head -n 1)
          if [ -n "$APK_ARM64" ] && [ -f "$APK_ARM64" ]; then
            cp "$APK_ARM64" output_apks/yokan-arm64-v8a.apk
          fi
          
          APK_UNIVERSAL=$(find app/android/build/outputs/apk/default/release -name "*universal-release.apk" | head -n 1)
          if [ -n "$APK_UNIVERSAL" ] && [ -f "$APK_UNIVERSAL" ]; then
            cp "$APK_UNIVERSAL" output_apks/yokan-universal.apk
          fi
          
          echo "Generated APKs:"
          ls -lh output_apks/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yokan-apks
          path: output_apks/*.apk
          if-no-files-found: error

      - name: Determine Tag Name
        id: tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "val=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.tag_name }}" ]; then
            echo "val=${{ inputs.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "val=v1.0.6" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.val }}
          name: Yokan ${{ steps.tag.outputs.val }}
          body: |
            ## Yokan ${{ steps.tag.outputs.val }}

            Aplicación moderna de anime con motor de reproducción por torrents P2P y catálogo impulsado por AniList.

            ### Archivos disponibles:
            - **`yokan-arm64-v8a.apk`**: APK optimizado para dispositivos Android modernos de 64 bits (arm64-v8a).
            - **`yokan-universal.apk`**: APK compatible con todas las arquitecturas Android.

            ### Características:
            - **Cerebro AniList**: Búsqueda, tendencias y catálogo global conectado en tiempo real con la API GraphQL de AniList.
            - **Motor Torrent Streaming P2P**: Búfer optimizado de 32MB con prioridad instantánea (`deadline = 0`) para reproducción en milisegundos.
            - **Filtro Español / Latino**: Búsqueda inteligente en Nyaa con prioridad para subtítulos en español y releases multilenguaje.
            - **Reproductor ExoPlayer**: Controles táctiles de brillo, volumen, tiempo y renderizado de subtítulos ASS/SSA.
          draft: false
          prerelease: false
          files: |
            output_apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
